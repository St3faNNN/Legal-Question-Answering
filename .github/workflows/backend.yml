name: backend

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Run tests
        env:
          APP_URL: http://localhost
          SANCTUM_STATEFUL_DOMAINS: localhost
        run: |
          php artisan config:clear
          php artisan test

  services:
    # The retrieval service carries the hybrid search; without this job its
    # pytest suite is unguarded. It used to be a two-service matrix — the
    # generation service was deleted when generation moved to a hosted endpoint,
    # and this job kept trying to cd into a directory that no longer exists.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [retrieval]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the services/*/Dockerfile base image.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        # torch comes from the CPU wheel index so the multi-GB CUDA build is
        # never pulled — same order as the Dockerfile.
        run: |
          pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: python -m pytest tests -q
