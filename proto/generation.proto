syntax = "proto3";

package graphrag.generation.v1;

option php_namespace = "App\\Grpc\\Pb\\Generation";
option php_metadata_namespace = "App\\Grpc\\Pb\\Generation\\GPBMetadata";

// Generation Service: question + retrieved context in, a generated answer out.
// No graph operations. The model is loaded once at server startup.
service Generation {
  rpc Generate(GenerateRequest) returns (GenerateResponse);
  // Server-streaming variant: emits the answer as it is produced, one chunk of
  // text per message, terminated by a chunk with done = true.
  rpc GenerateStream(GenerateRequest) returns (stream GenerateChunk);
}

message HistoryMessage {
  string role = 1;     // "user" | "assistant"
  string content = 2;
}

message GenerateRequest {
  string question = 1;
  string context = 2;
  // The linked entity that fills the prompt's "Correct response:" slot.
  // An empty string means no entity was linked (falls back to the question).
  string entity = 3;
  repeated HistoryMessage history = 4;
}

message GenerateResponse {
  string answer = 1;
  string model = 2;
  int32 tokens = 3;
  int32 latency_ms = 4;
}

// One streamed piece of the answer. Chunks with text are incremental; the final
// message has done = true and carries the total token count.
message GenerateChunk {
  string text = 1;
  bool done = 2;
  int32 tokens = 3;
  string model = 4;  // set on the final (done) chunk
}
