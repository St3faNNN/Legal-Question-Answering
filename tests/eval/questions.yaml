# Lawyer-authored evaluation set for the retrieval service.
#
# Each entry:
# id                 stable integer identifier (used for resume + compare)
# question           the Macedonian legal question, as asked
# expected_answer    the lawyer's expected answer (free text)
# expected_articles  OPTIONAL list of expected source article citations, e.g.
#                    ["ZAKON-ZA-JAVNITE, чл. 132"]
#                    Empty list = the corpus does not contain the answer.
#                    See `expected_refusal` below.
# expected_refusal   true when the answer is Agency guidance / interpretation
#                    rather than statutory text. The correct system behaviour
#                    is "Информацијата не е достапна во изворите"; a fluent
#                    answer here is a hallucination, not a success.
# confidence         low = verify this row against the corpus before trusting
#                    any score that depends on it.

